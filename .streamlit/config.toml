[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0f4beb"
backgroundColor = "#faf7f0"
secondaryBackgroundColor = "#f5eee2"
textColor = "#17243b"
font = "sans serif"

[client]
# No "Deploy" button: this is a local portfolio app, not a hosted one.
toolbarMode = "viewer"

[server]
# Serves static/ (the IBM Plex font files) at app/static/.
enableStaticServing = true
