[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0e6e66"
backgroundColor = "#f6f7f4"
secondaryBackgroundColor = "#eef1ed"
textColor = "#1c2430"
font = "sans serif"

[client]
# No "Deploy" button: this is a local portfolio app, not a hosted one.
toolbarMode = "viewer"

[server]
# Serves static/ (the IBM Plex font files) at app/static/.
enableStaticServing = true
